# hygiene.yaml — declared, drift-validated hygiene posture for this repo.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`.
#
# Personal Hugo site (Netlify CD). Floors are honest held-tier ratchets:
# README + .gitignore exist, LICENSE does not; the only standing build
# oracle is Netlify after push (ENT-001). Gaps sit above each floor as
# planned (or skipped where a control will never apply). Evidence is
# grounded in the 2026-08-22 entropy audit and files that exist today.

schema_version: 1

repo: marcelocantos.com
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 0   # no tests, no GitHub Actions; hugo runs only on Netlify after push
  security: 0      # no scanners; no Actions
  quality: 0       # no format/lint gate
  deps: 1          # theme pinned via submodule; pin is stale (2019)
  release: 0       # no tags or GitHub releases; Netlify CD is not a versioned release
  governance: 0    # README + .gitignore exist; LICENSE does not
  build: 1         # netlify.toml ships hugo --gc --minify with HUGO_VERSION pinned
  docs: 0          # README is a stub; entropy audit is T2 present
  perf: 0          # static site; no benchmark suite
  vcs: 1           # default branch is master; no committed hooks or branch protection
  agent: 0         # no AGENTS.md / CLAUDE.md; bullseye.yaml is T2 present

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # full matrix, examples run, lint/format, release + governance
  3: hardened    # formal specs, security scanning, SBOM/signing, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.hugo-ci
    dim: correctness
    desc: hugo --gc --minify runs in GitHub Actions before Netlify sees the commit
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 1
    reason: >-
      No .github/workflows. The shipped command lives only in netlify.toml
      and runs after push (ENT-001). Local hugo is green; it is not a gate.
    evidence: {absent: {file: {path: .github/workflows}}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harnesses over parsers / codecs
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: Hugo content site with no owned parsers or runtime codecs.
    evidence: {absent: {ci_job: "ci.yml#fuzz"}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.secret-scan
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: No gitleaks config or CI; relying on manual review of a small tree.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.sast-codeql
    dim: security
    desc: CodeQL static analysis
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      No application runtime; site is Hugo templates and Markdown. CodeQL
      will not be enabled unless a backend appears.
    evidence: {absent: {ci_job: "ci.yml#codeql"}}

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: No .github/workflows, so there is no permissions block to scope.
    evidence: {absent: {file: {path: .github/workflows}}}

  # ============================== CODE QUALITY ============================
  - id: quality.format
    dim: quality
    desc: Sources are formatter-clean, enforced in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: No prettier/markdownlint config and no format job.
    evidence: {absent: {file: {path: .prettierrc}}}

  - id: quality.lint
    dim: quality
    desc: A linter runs over templates and Markdown in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: No markdownlint/htmlhint/hugo lint job.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: Lint}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.theme-pin
    dim: deps
    desc: Hugo theme is pinned as a git submodule
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitmodules, matches: 'vanilla-bootstrap-hugo-theme'}}

  - id: deps.theme-freshness
    dim: deps
    desc: Theme submodule is reviewed against upstream on a release cadence
    state: planned
    cadence: per-release
    enforce: informational
    tier: 2
    reason: >-
      Submodule is frozen at dc8c6f2 (2019-01-12). No Dependabot or scheduled
      submodule bump (ENT-002).
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: History lives in git; no tags and no CHANGELOG.md.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  - id: release.github-artifacts
    dim: release
    desc: Versioned release artifacts built by GitHub Actions
    state: skipped
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      The product is a static site deployed by Netlify from git, not tagged
      binaries or packages.
    evidence: {absent: {file: {path: .github/workflows/release.yml}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: LICENSE present
    state: planned
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    reason: >-
      No LICENSE (gh licenseInfo=null). Public personal-site repo; default
      all-rights-reserved (ENT-007). Fleet convention is Apache-2.0 if licensed.
    evidence: {absent: {file: {path: LICENSE}}}

  - id: governance.readme
    dim: governance
    desc: README present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers Hugo public/, resource cache, and build lock
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore, matches: '/public'}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy.
    evidence: {absent: {file: {path: SECURITY.md}}}

  # ================================= BUILD ===============================
  - id: build.netlify
    dim: build
    desc: Netlify build is hugo --gc --minify with HUGO_VERSION pinned
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: netlify.toml, matches: 'hugo --gc --minify'}}

  - id: build.github-actions
    dim: build
    desc: GitHub Actions runs the shipped hugo command before deploy
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 2
    reason: No .github/workflows; Netlify is the only build (ENT-001).
    evidence: {absent: {file: {path: .github/workflows}}}

  # ============================ DOCUMENTATION ============================
  - id: docs.build-instructions
    dim: docs
    desc: README documents Hugo version, local serve, and Netlify deploy
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 1
    reason: README.md is a heading plus “Hugo source repo”; no build recipe (ENT-007).
    evidence: {absent: {file: {path: README.md, matches: 'hugo server|HUGO_VERSION|netlify'}}}

  - id: docs.entropy-audit
    dim: docs
    desc: Snapshot entropy audit (2026-08-22) is in-tree
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: docs/audits/entropy-audit-2026-08-22.md}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Benchmark suite exists
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: Static Hugo site; no runtime to benchmark.
    evidence: {absent: {file: {path: benches}}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.default-branch
    dim: vcs
    desc: Default branch is master
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {gh_setting: {key: default_branch, equals: master}}

  - id: vcs.branch-protection
    dim: vcs
    desc: master is protected
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: Branch protection 404; master is unprotected.
    evidence:
      absent:
        command: gh api repos/marcelocantos/marcelocantos.com/branches/master/protection --jq .url

  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.agents-md
    dim: agent
    desc: AGENTS.md present (conventions discoverable by agents)
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 1
    reason: No AGENTS.md or CLAUDE.md (ENT-007).
    evidence: {absent: {file: {path: AGENTS.md}}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}
