baseURL: //marcelocantos.com
languageCode: en-us
title: Marcelo Cantos
theme: vanilla-bootstrap-hugo-theme
pygmentsCodeFences: true
pygmentsCodeFencesGuessSyntax: true
pygmentsStyle: github

# Preserve raw HTML in Markdown (e.g. the <span> markup in the GOOS/GOARCH
# table). Goldmark strips raw HTML by default (unsafe: false) since Hugo 0.60.
markup:
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
  - name: Home
    pre: home
    url: /
    weight: 1
  - name: Blog
    pre: edit
    url: /posts/
    weight: 2
  - name: RSS
    pre: rss
    url: /index.xml
    weight: 5
